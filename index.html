    const getEmbedVideo = (url) => {
      if (!url) return null;
      // YouTube
      const ytMatch = url.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
      if (ytMatch) {
        return { type: 'youtube', embedUrl: `https://www.youtube.com/embed/${ytMatch[1]}?autoplay=1&mute=1&loop=1&playlist=${ytMatch[1]}&playsinline=1` };
      }
      // Vimeo
      const vimeoMatch = url.match(/(?:vimeo\.com\/)(\d+)/);
      if (vimeoMatch) {
        return { type: 'vimeo', embedUrl: `https://player.vimeo.com/video/${vimeoMatch[1]}?autoplay=1&muted=1&loop=1` };
      }
      return null;
    };

    // --- 마우스 커서를 따라다니는 O 캐릭터 컴포넌트 ---
    const InteractiveO = () => {
      const containerRef = useRef(null);
      const eyesRef = useRef(null);

      useEffect(() => {
        let animationFrameId;
        
        const handleMouseMove = (e) => {
          if (!containerRef.current || !eyesRef.current) return;
          
          cancelAnimationFrame(animationFrameId);
          animationFrameId = requestAnimationFrame(() => {
            const rect = containerRef.current.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            
            const angle = Math.atan2(dy, dx);
            const maxRadius = 4; 
            const distance = Math.min(Math.sqrt(dx * dx + dy * dy) * 0.015, maxRadius);
            
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            if (eyesRef.current) {
              eyesRef.current.style.transform = `translate(${tx}px, ${ty}px)`;
            }
          });
        };

        window.addEventListener('mousemove', handleMouseMove);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <span 
          ref={containerRef} 
          className="relative inline-flex items-center justify-center mx-[2px] rounded-[40%] border-[3px] md:border-[4px] border-white"
          style={{ width: '0.75em', height: '0.85em', transform: 'translateY(1px)' }}

          </span>
        </span>

    };

    const CustomVideoPlayer = ({ src, className = "" }) => {
      const videoRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(true);
      const [progress, setProgress] = useState(0);

      const [duration, setDuration] = useState(0);

      const embed = getEmbedVideo(src);

      }

      // 일반 MP4/동영상 파일인 경우
      const togglePlay = (e) => {
        if (e) e.stopPropagation();
        if (videoRef.current.paused) {
          videoRef.current.play();
          setIsPlaying(true);
        } else {
          videoRef.current.pause();
          setIsPlaying(false);
        }
      };

      const toggleMute = (e) => {
        if (e) e.stopPropagation();
        videoRef.current.muted = !isMuted;
        setIsMuted(!isMuted);
      };

      const toggleFullScreen = (e) => {
        if (e) e.stopPropagation();
        if (videoRef.current.requestFullscreen) {
          videoRef.current.requestFullscreen();
        }
      };

      const handleTimeUpdate = () => {
        if (!videoRef.current) return;
        setCurrentTime(videoRef.current.currentTime);
        setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100);
      };

      const handleLoadedMetadata = () => {
        setDuration(videoRef.current.duration);
      };

      const handleProgressClick = (e) => {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        videoRef.current.currentTime = pos * duration;
      };

      const formatTime = (time) => {
        if (isNaN(time)) return "0:00";
        const m = Math.floor(time / 60);
        const s = Math.floor(time % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div 
          className={`relative w-full flex justify-center bg-white group overflow-hidden ${className}`}
          onMouseEnter={() => setShowControls(true)}
          onMouseLeave={() => setShowControls(false)}

            playsInline

            onLoadedMetadata={handleLoadedMetadata}
            onClick={togglePlay}

            <div className="w-full h-1 bg-gray-500/50 cursor-pointer group/bar relative rounded-full" onClick={handleProgressClick}>
              <div className="absolute top-0 left-0 h-full bg-white transition-all duration-75 rounded-full" style={{ width: `${progress}%` }} />
              <div className="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover/bar:opacity-100 transition-opacity pointer-events-none" style={{ left: `${progress}%`, transform: 'translate(-50%, -50%)' }} />
            </div>

            <div className="flex justify-between items-center text-white font-mono text-xs tracking-widest">
              <div className="flex items-center gap-6">
                <button onClick={togglePlay} className="hover:text-gray-400 transition-colors font-bold uppercase">
                  {isPlaying ? 'Pause' : 'Play'}
                </button>
                <button onClick={toggleMute} className="hover:text-gray-400 transition-colors font-bold uppercase">
                  {isMuted ? 'Unmute' : 'Mute'}

                <span className="opacity-70 hidden md:block">

                <button onClick={toggleFullScreen} className="hover:text-gray-400 transition-colors font-bold uppercase">
                  Fullscreen
                </button>
              </div>
            </div>

        setNewProject(prev => ({ ...prev, detailBlocks: prev.detailBlocks.map(b => b.id === id ? { ...b, content: file, mediaType: isVideo ? 'video' : 'image' } : b) }));

      const handleSaveProject = async (e) => {
        e.preventDefault();
        setFormError("");
        if (!newProject.title || newProject.categories.length === 0) { setFormError("Title and Category are required."); return; }
        
        setIsUploading(true);
        try {
          let urlToSave = editingId ? projects.find(p => p.id === editingId)?.mediaUrl : '';
          let typeToSave = editingId ? projects.find(p => p.id === editingId)?.mediaType : 'image';
          
          if (coverUrlInput.trim()) {
            urlToSave = coverUrlInput.trim();
            typeToSave = (urlToSave.includes('youtube') || urlToSave.includes('youtu.be') || urlToSave.includes('vimeo') || urlToSave.endsWith('.mp4')) ? 'video' : 'image';
          } else if (coverMedia) {
            urlToSave = await uploadFileToStorage(coverMedia);
            typeToSave = coverMedia.type.startsWith('video/') ? 'video' : 'image';
          } else if (!editingId && !coverMedia && !coverUrlInput) {
            setFormError("Cover media or video link is required.");
            setIsUploading(false);
            return;
          }

          const processedBlocks = [];
          for (let block of newProject.detailBlocks) {
            if (block.type === 'media' && block.content instanceof File) {
              const uploaded = await uploadFileToStorage(block.content);
              processedBlocks.push({ ...block, content: uploaded });
            } else {
              processedBlocks.push(block);
            }
          }

          const finalProject = { ...newProject, detailBlocks: processedBlocks, mediaUrl: urlToSave, mediaType: typeToSave };
          let updatedList;
          if (editingId) updatedList = projects.map(p => p.id === editingId ? { ...finalProject, id: p.id } : p);
          else updatedList = [{ ...finalProject, id: 'p' + Date.now() }, ...projects];

          setProjects(updatedList);
          await saveToSupabase('projects', updatedList);
          resetAdminState();
        } catch (err) {
          setFormError("저장 중 오류 발생: " + err.message);
        } finally {
          setIsUploading(false);
        }
      };

                                </div>
                              ))}
                              {newProject.detailBlocks.length === 0 && <div className="py-12 border border-dashed border-gray-300 bg-gray-50 text-center text-gray-400 font-mono text-sm uppercase tracking-widest">No blocks added</div>}
                            </div>
                          </div>
                          <div className="flex gap-4">
                            <button type="button" onClick={() => setAdminView('list')} className="w-1/3 border border-gray-300 bg-white text-black py-4 font-mono text-sm uppercase tracking-widest font-bold hover:bg-gray-50 transition-colors">Cancel</button>
                            <button type="submit" disabled={isUploading} className="w-2/3 bg-black text-white py-4 font-mono text-sm uppercase tracking-widest font-bold hover:bg-gray-800 transition-colors">
                              {isUploading ? "Uploading..." : (editingId ? 'Save Changes' : 'Publish Project')}
                            </button>
                          </div>
                        </form>
                      ) : (
                        <form onSubmit={handleSavePlayground} className="flex flex-col gap-6 bg-white p-8 border border-gray-200">
                          <h3 className="font-mono text-sm font-bold uppercase tracking-widest border-b border-gray-200 pb-4 mb-2">Playground Upload</h3>
                          <div>
                            <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-3">Categories</label>
                            <div className="flex flex-wrap gap-2">
                              {FILTERS.filter(f => f !== 'ALL').map(cat => (
                                <label key={cat} className={`cursor-pointer border px-4 py-2 text-xs font-mono font-bold uppercase tracking-widest transition-all ${newPlayground.categories.includes(cat) ? 'bg-black border-black text-white' : 'bg-white border-gray-300 text-gray-500 hover:border-black hover:text-black'}`}>
                                  <input type="checkbox" className="hidden" checked={newPlayground.categories.includes(cat)} onChange={() => setNewPlayground(p => ({...p, categories: p.categories.includes(cat) ? p.categories.filter(c => c !== cat) : [...p.categories, cat]}))} />
                                  {cat}
                                </label>
                              ))}
                            </div>
                          </div>
                          <div className="flex flex-col gap-3">
                            <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest">Media {!editingId && '[Required]'}</label>
                            <input 
                              type="url" 
                              value={pgUrlInput} 
                              onChange={e => { setPgUrlInput(e.target.value); setPgMedia(null); }} 
                              placeholder="YouTube / Vimeo 링크 입력 (권장)" 
                              className="w-full bg-gray-50 border border-gray-200 p-3 text-xs text-black font-mono focus:outline-none focus:border-black" 
                            />
                            <div className="text-center font-mono text-[10px] text-gray-400 uppercase tracking-widest">--- OR 직접 파일 업로드 ---</div>
                            <div className="border border-dashed border-gray-300 p-6 bg-gray-50 hover:bg-gray-100 transition-colors">
                              <input type="file" accept="image/*,video/*" onChange={e => { setPgMedia(e.target.files[0]); setPgUrlInput(""); }} className="text-sm font-mono text-gray-500 file:mr-4 file:py-2 file:px-4 file:border file:border-gray-300 file:bg-white file:text-black file:font-mono file:text-xs file:uppercase file:tracking-widest file:cursor-pointer hover:file:bg-gray-50" />
                            </div>
                          </div>
                          <div className="flex gap-4 mt-4">
                            <button type="button" onClick={() => setAdminView('list')} className="w-1/3 border border-gray-300 bg-white text-black py-4 font-mono text-sm uppercase tracking-widest font-bold hover:bg-gray-50 transition-colors">Cancel</button>
                            <button type="submit" disabled={isUploading} className="w-2/3 bg-black text-white py-4 font-mono text-sm uppercase tracking-widest font-bold hover:bg-gray-800 transition-colors">
                              {isUploading ? "Uploading..." : (editingId ? 'Save Changes' : 'Publish')}
                            </button>
                          </div>
                        </form>
                      )}
                    </div>
                  )}
                </div>
              </main>
            </div>
          )}

          {/* DETAIL PAGE MODAL (WORK) */}
          {selectedProject && (
            <div className="fixed inset-0 bg-white z-[150] flex flex-col pointer-events-auto overflow-y-auto animate-fade-in">
              <div className="w-full p-6 md:p-10 flex flex-col sm:flex-row justify-between items-start sticky top-0 bg-white/90 backdrop-blur-sm z-10 gap-4">
                <div className="flex-1">
                  <h2 className="font-anton text-4xl md:text-6xl uppercase tracking-wide break-words">{selectedProject.title}</h2>
                  <div className="flex flex-wrap gap-4 md:gap-6 mt-4 font-mono text-xs text-gray-500 uppercase tracking-widest">
                    <p>Categories <br/><span className="text-black font-bold text-[10px] md:text-sm">{selectedProject.categories.join(', ')}</span></p>
                    <p>Project Type <br/><span className="text-black font-bold text-[10px] md:text-sm">{selectedProject.projectType || 'Individual'}</span></p>
                    <p>Year <br/><span className="text-black font-bold text-[10px] md:text-sm">{selectedProject.year}</span></p>
                    <p>Tools <br/><span className="text-black font-bold text-[10px] md:text-sm">{(selectedProject.tools || []).join(', ') || 'N/A'}</span></p>
                  </div>
                </div>
                
                <button 
                  onClick={() => setSelectedProject(null)} 
                  className="w-10 h-10 md:w-12 md:h-12 border-2 border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all duration-300 shrink-0 group"
                  aria-label="Close"
                >
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="transition-transform duration-300 group-hover:rotate-90">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>

              <div className="w-full max-w-5xl mx-auto px-6 md:px-10 pb-32 mt-4 space-y-12 md:space-y-20">
                <div className="w-full bg-white flex justify-center">
                  {selectedProject.mediaType === 'video' ? (
                    <CustomVideoPlayer src={selectedProject.mediaUrl} className="max-h-[70vh]" />
                  ) : (
                    <img src={selectedProject.mediaUrl} className="w-full h-auto max-h-[70vh] object-contain bg-white" />
                  )}
                </div>
                
                {selectedProject.description && (
                  <div className="font-mono text-base md:text-lg text-gray-800 leading-relaxed max-w-3xl border-l-4 border-black pl-6">
                    {selectedProject.description.split('\n').map((line, idx) => <p key={idx} className="mb-2">{line}</p>)}
                  </div>
                )}

                {selectedProject.detailBlocks && selectedProject.detailBlocks.map(block => (
                  <div key={block.id} className="w-full flex justify-center">
                    {block.type === 'text' ? (
                      <div className={`text-sm text-gray-800 leading-relaxed max-w-3xl w-full px-6
                        ${block.align === 'center' ? 'text-center' : block.align === 'right' ? 'text-right' : 'text-left'}
                        ${block.font === 'anton' ? 'font-anton text-4xl uppercase' : block.font === 'mono' ? 'font-mono' : 'font-sans text-base'}
                      `}>
                        {block.content.split('\n').map((line, idx) => <p key={idx} className="mb-4">{line}</p>)}
                      </div>
                    ) : block.type === 'media' && block.content ? (
                      <div className="w-full bg-white flex justify-center">
                        {block.mediaType === 'video' ? (
                          <CustomVideoPlayer src={block.content} className="max-h-[70vh]" />
                        ) : (
                          <img src={block.content} className="w-full h-auto max-h-[70vh] object-contain bg-white" />
                        )}
                      </div>
                    ) : null}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* PLAYGROUND LIGHTBOX MODAL */}
          {selectedPlaygroundItem && (
            <div 
              className="fixed inset-0 bg-white/90 backdrop-blur-md z-[300] flex items-center justify-center p-6 animate-fade-in pointer-events-auto"
              onClick={() => setSelectedPlaygroundItem(null)}
            >
              <button 
                onClick={(e) => { e.stopPropagation(); setSelectedPlaygroundItem(null); }} 
                className="absolute top-4 md:top-6 right-4 md:right-6 w-10 h-10 border-2 border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all group z-10"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="group-hover:rotate-90 transition-transform">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
              <div className="w-full max-w-5xl flex justify-center items-center" onClick={(e) => e.stopPropagation()}>
                {selectedPlaygroundItem.mediaType === 'video' ? (
                  <CustomVideoPlayer src={selectedPlaygroundItem.mediaUrl} className="max-h-[80vh]" />
                ) : (
                  <img src={selectedPlaygroundItem.mediaUrl} className="w-full h-auto max-h-[80vh] object-contain" />
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
