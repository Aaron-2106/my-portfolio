    const InteractiveO = () => {
      const containerRef = useRef(null);
      const eyesRef = useRef(null);

      useEffect(() => {
        let animationFrameId;
        const handleMouseMove = (e) => {
          if (!containerRef.current || !eyesRef.current) return;
          cancelAnimationFrame(animationFrameId);
          animationFrameId = requestAnimationFrame(() => {
            const rect = containerRef.current.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = e.clientX - centerX;
            const dy = e.clientY - centerY;
            const angle = Math.atan2(dy, dx);
            const maxRadius = 4; 
            const distance = Math.min(Math.sqrt(dx * dx + dy * dy) * 0.015, maxRadius);
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            if (eyesRef.current) {
              eyesRef.current.style.transform = `translate(${tx}px, ${ty}px)`;
            }
          });
        };
        window.addEventListener('mousemove', handleMouseMove);
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return (
        <span ref={containerRef} className="relative inline-flex items-center justify-center mx-[2px] rounded-[40%] border-[3px] md:border-[4px] border-white"
          style={{ width: '0.75em', height: '0.85em', transform: 'translateY(1px)' }}>
          <span ref={eyesRef} className="flex gap-[3px]" style={{ transition: 'transform 0.05s ease-out' }}>

          </span>
        </span>
      );
    };

    const CustomVideoPlayer = ({ src, className = "" }) => {
      const videoRef = useRef(null);
      const [isPlaying, setIsPlaying] = useState(true);
      const [isMuted, setIsMuted] = useState(true);
      const [progress, setProgress] = useState(0);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [showControls, setShowControls] = useState(false);

      const togglePlay = (e) => {
        if (e) e.stopPropagation();
        if (videoRef.current.paused) { videoRef.current.play(); setIsPlaying(true); } 
        else { videoRef.current.pause(); setIsPlaying(false); }
      };
      const toggleMute = (e) => {
        if (e) e.stopPropagation();
        videoRef.current.muted = !isMuted; setIsMuted(!isMuted);
      };
      const toggleFullScreen = (e) => {
        if (e) e.stopPropagation();
        if (videoRef.current.requestFullscreen) videoRef.current.requestFullscreen();
      };
      const handleTimeUpdate = () => {
        if (!videoRef.current) return;
        setCurrentTime(videoRef.current.currentTime);
        setProgress((videoRef.current.currentTime / videoRef.current.duration) * 100);
      };
      const handleLoadedMetadata = () => { setDuration(videoRef.current.duration); };
      const handleProgressClick = (e) => {
        e.stopPropagation();
        const rect = e.currentTarget.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        videoRef.current.currentTime = pos * duration;
      };
      const formatTime = (time) => {
        if (isNaN(time)) return "0:00";
        const m = Math.floor(time / 60); const s = Math.floor(time % 60);
        return `${m}:${s < 10 ? '0' : ''}${s}`;
      };

      return (
        <div className={`relative w-full flex justify-center bg-black group overflow-hidden ${className}`}
          onMouseEnter={() => setShowControls(true)} onMouseLeave={() => setShowControls(false)}>
          <video ref={videoRef} src={src} autoPlay loop muted={isMuted} playsInline
            onTimeUpdate={handleTimeUpdate} onLoadedMetadata={handleLoadedMetadata} onClick={togglePlay}
            className="w-full h-full object-contain cursor-pointer" />
          <div className={`absolute bottom-0 left-0 w-full p-6 bg-gradient-to-t from-black/90 via-black/40 to-transparent transition-opacity duration-300 flex flex-col gap-4 ${showControls ? 'opacity-100' : 'opacity-0'}`}>
            <div className="w-full h-1 bg-gray-500/50 cursor-pointer group/bar relative rounded-full" onClick={handleProgressClick}>
              <div className="absolute top-0 left-0 h-full bg-white transition-all duration-75 rounded-full" style={{ width: `${progress}%` }} />
              <div className="absolute top-1/2 -translate-y-1/2 w-3 h-3 bg-white rounded-full opacity-0 group-hover/bar:opacity-100 transition-opacity pointer-events-none" style={{ left: `${progress}%`, transform: 'translate(-50%, -50%)' }} />
            </div>
            <div className="flex justify-between items-center text-white font-mono text-xs tracking-widest">
              <div className="flex items-center gap-6">
                <button onClick={togglePlay} className="hover:text-gray-400 transition-colors font-bold uppercase">{isPlaying ? 'Pause' : 'Play'}</button>
                <button onClick={toggleMute} className="hover:text-gray-400 transition-colors font-bold uppercase">{isMuted ? 'Unmute' : 'Mute'}</button>
                <span className="opacity-70 hidden md:block">{formatTime(currentTime)} / {formatTime(duration)}</span>
              </div>
              <div className="flex items-center gap-6">
                <span className="opacity-50 text-[10px] hidden sm:block border border-white/20 px-2 py-0.5 rounded">HD</span>
                <button onClick={toggleFullScreen} className="hover:text-gray-400 transition-colors font-bold uppercase">Fullscreen</button>
              </div>
            </div>
          </div>
        </div>
      );
    };

                        </div>
                        <div>
                          <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">LinkedIn URL</label>
                          <input type="url" value={contactData.linkedin} onChange={e => setContactData({...contactData, linkedin: e.target.value})} className="w-full bg-gray-50 border border-gray-200 p-4 text-sm text-black font-mono focus:outline-none focus:border-black" />
                        </div>
                        <div>
                          <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Behance URL</label>
                          <input type="url" value={contactData.behance} onChange={e => setContactData({...contactData, behance: e.target.value})} className="w-full bg-gray-50 border border-gray-200 p-4 text-sm text-black font-mono focus:outline-none focus:border-black" />
                        </div>
                        <div className="border-t border-gray-200 pt-6 mt-2">
                          <button type="submit" className="w-full md:w-auto px-10 py-4 bg-black text-white font-mono text-sm uppercase tracking-widest font-bold hover:bg-gray-800 transition-colors">Save Contact Info</button>
                        </div>
                      </form>
                    </div>
                  ) : adminView === 'list' ? (
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                      {(adminTab === 'projects' ? projects : playgroundItems).map((item, index) => (
                        <div key={item.id} draggable
                          onDragStart={(e) => { setDraggedIdx(index); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => e.target.style.opacity = '0.4', 0); }}
                          onDragEnter={(e) => { e.preventDefault(); setDragOverIdx(index); }} onDragOver={(e) => e.preventDefault()}
                          onDrop={(e) => handleDrop(e, index, adminTab === 'playground')}
                          onDragEnd={(e) => { e.target.style.opacity = '1'; setDraggedIdx(null); setDragOverIdx(null); }}
                          className={`bg-white border ${dragOverIdx === index ? 'border-black border-dashed bg-gray-50' : 'border-gray-200'} p-5 flex flex-col gap-4 hover:border-gray-400 transition-all duration-300 cursor-grab active:cursor-grabbing`}
                        >
                          <div className="flex justify-between items-start">
                            <div className="flex flex-wrap gap-1.5">
                              {item.categories.map(c => <span key={c} className="border border-gray-300 text-black text-[10px] font-bold px-2 py-1 uppercase tracking-wider">{c}</span>)}
                            </div>
                            <div className="text-gray-400 cursor-grab p-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></div>
                          </div>
                          <div className="w-full h-40 bg-gray-100 overflow-hidden relative border border-gray-200">
                            {item.mediaType === 'image' ? ( <img src={item.mediaUrl} className="w-full h-full object-cover grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all"/> ) : ( <video src={item.mediaUrl} className="w-full h-full object-cover grayscale opacity-80 hover:grayscale-0 hover:opacity-100 transition-all" /> )}
                            {item.mediaType === 'video' && <div className="absolute top-2 right-2 bg-white border border-gray-200 text-black text-[9px] px-2 py-1 uppercase font-bold tracking-widest">Video</div>}
                          </div>
                          <div className="flex-1 flex flex-col justify-between border-t border-gray-100 pt-4 mt-2">
                          {adminTab === 'projects' && (
                            <div className="mb-4">
                              <h4 className="font-bold text-base text-black mb-1 truncate uppercase">{item.title}</h4>
                              <p className="text-xs text-gray-500 font-mono uppercase tracking-wider truncate">{item.projectType} / {item.year}</p>
                            </div>
                          )}
                          <div className="flex gap-2 mt-auto">
                            <button onClick={() => {
                              if (adminTab === 'projects') { setNewProject({ title: item.title, categories: item.categories, year: item.year, projectType: item.projectType || 'Individual', tools: item.tools || [], description: item.description, detailBlocks: item.detailBlocks || [] }); } 
                              else { setNewPlayground({ categories: item.categories }); }
                              setEditingId(item.id); setAdminView('form');
                              }} className="flex-1 py-2 bg-gray-100 hover:bg-gray-200 text-black text-xs font-mono font-bold uppercase tracking-widest transition-colors">Edit</button>
                            <button onClick={() => {
                              if (adminTab === 'projects') setProjects(projects.filter(p => p.id !== item.id));
                              else setPlaygroundItems(playgroundItems.filter(p => p.id !== item.id));
                            }} className="flex-1 py-2 border border-gray-200 hover:bg-black hover:text-white text-black text-xs font-mono font-bold uppercase tracking-widest transition-colors">Delete</button>
                          </div>
                          </div>
                        </div>
                      ))}
                      {(adminTab === 'projects' ? projects : playgroundItems).length === 0 && (
                        <div className="col-span-full py-20 flex flex-col items-center justify-center border border-dashed border-gray-300 bg-gray-50 text-gray-400 font-mono text-sm uppercase tracking-widest"><p>No items found.</p></div>
                      )}
                    </div>
                  ) : (
                    <div className="max-w-4xl">
                      {formError && <div className="bg-gray-100 border border-black text-black p-4 text-sm font-mono font-bold uppercase tracking-wider mb-8">{formError}</div>}
                      {adminTab === 'projects' ? (
                        <form onSubmit={handleSaveProject} className="flex flex-col gap-6 md:gap-8">
                          <div className="bg-white p-6 md:p-8 border border-gray-200 flex flex-col gap-6">
                            <h3 className="font-mono text-sm font-bold uppercase tracking-widest border-b border-gray-200 pb-4 mb-2">Basic Info</h3>
                            <div>
                              <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Project Title</label>
                              <input required value={newProject.title} onChange={e => setNewProject({...newProject, title: e.target.value})} className="w-full bg-transparent border-b border-gray-300 py-3 text-black text-xl uppercase focus:outline-none focus:border-black transition-all" />
                            </div>
                            <div>
                              <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-3">Categories</label>
                              <div className="flex flex-wrap gap-2">
                                {FILTERS.filter(f => f !== 'ALL').map(cat => (
                                  <label key={cat} className={`cursor-pointer border px-4 py-2 text-xs font-mono font-bold uppercase tracking-widest transition-all ${newProject.categories.includes(cat) ? 'bg-black border-black text-white' : 'bg-white border-gray-300 text-gray-500'}`}>
                                    <input type="checkbox" className="hidden" checked={newProject.categories.includes(cat)} onChange={() => setNewProject(p => ({...p, categories: p.categories.includes(cat) ? p.categories.filter(c => c !== cat) : [...p.categories, cat]}))} />
                                    {cat}
                                  </label>
                                ))}
                              </div>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                              <div>
                                <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Year</label>
                                <input value={newProject.year} onChange={e => setNewProject({...newProject, year: e.target.value})} className="w-full bg-transparent border-b border-gray-300 py-2 text-black text-sm focus:outline-none focus:border-black" />
                              </div>
                              <div>
                                <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Project Type</label>
                                <div className="flex gap-2">
                                  {['Individual', 'Group'].map(type => (
                                    <button key={type} type="button" onClick={() => setNewProject({...newProject, projectType: type})} className={`flex-1 py-2 text-[10px] md:text-xs font-mono font-bold uppercase tracking-widest border transition-colors ${newProject.projectType === type ? 'bg-black text-white border-black' : 'bg-white text-gray-500 border-gray-300'}`}>{type}</button>
                                  ))}
                                </div>
                              </div>
                            </div>
                            <div>
                              <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-3">Tools Used</label>
                              <div className="flex flex-wrap gap-2 mb-3">
                                {availableTools.map(tool => (
                                  <label key={tool} className={`cursor-pointer border px-3 py-1.5 text-[10px] font-mono font-bold uppercase tracking-widest transition-all ${newProject.tools.includes(tool) ? 'bg-black border-black text-white' : 'bg-white border-gray-300 text-gray-500'}`}>
                                    <input type="checkbox" className="hidden" checked={newProject.tools.includes(tool)} onChange={() => setNewProject(p => ({...p, tools: p.tools.includes(tool) ? p.tools.filter(t => t !== tool) : [...p.tools, tool]}))} />
                                    {tool}
                                  </label>
                                ))}
                              </div>
                              <div className="flex gap-2 max-w-sm border-b border-gray-300 focus-within:border-black transition-colors">
                                <input value={customToolInput} onChange={(e) => setCustomToolInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleAddCustomTool(e)} className="w-full bg-transparent py-2 text-black text-xs font-mono focus:outline-none" />
                                <button type="button" onClick={handleAddCustomTool} className="font-mono text-xs font-bold uppercase tracking-widest text-black">ADD</button>
                              </div>
                            </div>
                            <div>
                              <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Cover Media</label>
                                <div className="border border-dashed border-gray-300 p-4 md:p-8 bg-gray-50 overflow-hidden">
                                  <input type="file" accept="image/*,video/*" onChange={e => setCoverMedia(e.target.files[0])} className="w-full text-[10px] md:text-xs font-mono text-gray-500 file:mr-2 md:file:mr-4 file:py-1 md:file:py-2 file:px-2 md:file:px-4 file:border file:border-gray-300 file:bg-white file:text-black file:uppercase file:cursor-pointer" />
                                </div>
                              </div>
                              <div>
                                <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Description</label>
                                <textarea value={newProject.description} onChange={e => setNewProject({...newProject, description: e.target.value})} className="w-full bg-gray-50 border border-gray-200 p-4 text-sm text-black focus:outline-none focus:border-black h-24 resize-none" />
                              </div>
                          </div>
                          
                          <div className="bg-white p-6 md:p-8 border border-gray-200 flex flex-col gap-6">
                            <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end border-b border-gray-200 pb-4 mb-2 gap-4">
                              <div>
                                <h3 className="font-mono text-sm font-bold uppercase tracking-widest text-black mb-1">Detail Page</h3>
                                <p className="text-xs text-gray-400 font-mono tracking-wider">Drag to reorder</p>
                              </div>
                              <div className="flex gap-2">
                                <button type="button" onClick={() => addDetailBlock('text')} className="bg-black text-white px-4 py-2 font-mono text-[10px] md:text-xs uppercase tracking-widest">Add Text</button>
                                <button type="button" onClick={() => addDetailBlock('media')} className="bg-white text-black border border-gray-300 px-4 py-2 font-mono text-[10px] md:text-xs uppercase tracking-widest">Add Media</button>
                              </div>
                            </div>
                            <div className="flex flex-col gap-4">
                              {newProject.detailBlocks.map((block, idx) => (
                                <div key={block.id} draggable
                                  onDragStart={(e) => { setDraggedBlockIdx(idx); e.dataTransfer.effectAllowed = 'move'; setTimeout(() => e.target.style.opacity = '0.4', 0); }}
                                  onDragEnter={(e) => { e.preventDefault(); setDragOverBlockIdx(idx); }} onDragOver={(e) => e.preventDefault()}
                                  onDrop={(e) => handleBlockDrop(e, idx)} onDragEnd={(e) => { e.target.style.opacity = '1'; setDraggedBlockIdx(null); setDragOverBlockIdx(null); }}
                                  className={`bg-[#FAFAFA] border ${dragOverBlockIdx === idx ? 'border-black border-dashed' : 'border-gray-200'} p-3 md:p-5 flex gap-2 md:gap-4 cursor-grab`}
                                >
                                  <div className="pt-2 text-gray-300"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="9" cy="12" r="1"></circle><circle cx="9" cy="5" r="1"></circle><circle cx="9" cy="19" r="1"></circle><circle cx="15" cy="12" r="1"></circle><circle cx="15" cy="5" r="1"></circle><circle cx="15" cy="19" r="1"></circle></svg></div>
                                  <div className="flex-1 border-l border-gray-200 pl-2 md:pl-4 overflow-hidden">
                                    {block.type === 'text' ? (
                                      <>
                                        <div className="flex flex-col sm:flex-row gap-2 sm:gap-4 mb-3 pb-3 border-b border-gray-200">
                                          <div className="flex gap-2">
                                            <span className="hidden sm:inline text-[10px] text-gray-400 font-mono uppercase self-center mr-1">Align</span>
                                            {['left', 'center', 'right'].map(align => (
                                              <button type="button" key={align} onClick={() => updateDetailBlockStyle(block.id, 'align', align)} className={`px-2 py-1 text-[10px] font-mono uppercase border ${block.align === align ? 'bg-black text-white' : 'bg-white text-gray-500'}`}>{align}</button>
                                            ))}
                                          </div>
                                          <div className="flex gap-2 sm:border-l border-gray-200 sm:pl-4">
                                            <span className="hidden sm:inline text-[10px] text-gray-400 font-mono uppercase self-center mr-1">Font</span>
                                            {['sans', 'mono', 'anton'].map(font => (
                                              <button type="button" key={font} onClick={() => updateDetailBlockStyle(block.id, 'font', font)} className={`px-2 py-1 text-[10px] font-mono uppercase border ${block.font === font ? 'bg-black text-white' : 'bg-white text-gray-500'}`}>{font}</button>
                                            ))}
                                          </div>
                                        </div>
                                        <textarea value={block.content} onChange={e => updateDetailBlockText(block.id, e.target.value)} className="w-full p-0 bg-transparent border-none outline-none resize-none text-black text-sm" rows={3} />
                                      </>
                                    ) : (
                                      <div className="border border-dashed border-gray-300 bg-white p-4 overflow-hidden">
                                        <input type="file" accept="image/*,video/*" onChange={e => updateDetailBlockMedia(block.id, e.target.files[0])} className="w-full text-[10px] font-mono file:mr-2 file:py-1 file:px-2 file:border file:border-gray-300 file:bg-gray-50 file:text-black file:uppercase cursor-pointer" />
                                      </div>
                                    )}
                                  </div>
                                  <button type="button" onClick={() => removeDetailBlock(block.id)} className="text-gray-400 hover:text-black font-mono text-[10px] md:text-xs tracking-widest self-start pl-1 md:pl-2">X</button>
                                </div>
                              ))}
                              {newProject.detailBlocks.length === 0 && <div className="py-8 border border-dashed border-gray-300 bg-gray-50 text-center text-gray-400 font-mono text-xs uppercase tracking-widest">No blocks</div>}
                            </div>
                          </div>
                          <div className="flex gap-4">
                            <button type="button" onClick={() => setAdminView('list')} className="w-1/3 border border-gray-300 bg-white text-black py-4 font-mono text-sm uppercase tracking-widest font-bold">Cancel</button>
                            <button type="submit" className="w-2/3 bg-black text-white py-4 font-mono text-sm uppercase tracking-widest font-bold">{editingId ? 'Save' : 'Publish'}</button>
                          </div>
                        </form>
                      ) : (
                        <form onSubmit={handleSavePlayground} className="flex flex-col gap-6 bg-white p-6 md:p-8 border border-gray-200">
                          <div>
                            <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-3">Categories</label>
                            <div className="flex flex-wrap gap-2">
                              {FILTERS.filter(f => f !== 'ALL').map(cat => (
                                <label key={cat} className={`cursor-pointer border px-4 py-2 text-xs font-mono font-bold uppercase tracking-widest transition-all ${newPlayground.categories.includes(cat) ? 'bg-black border-black text-white' : 'bg-white border-gray-300 text-gray-500'}`}>
                                  <input type="checkbox" className="hidden" checked={newPlayground.categories.includes(cat)} onChange={() => setNewPlayground(p => ({...p, categories: p.categories.includes(cat) ? p.categories.filter(c => c !== cat) : [...p.categories, cat]}))} />
                                  {cat}
                                </label>
                              ))}
                            </div>
                          </div>
                          <div>
                            <label className="block text-xs font-mono font-bold text-gray-500 uppercase tracking-widest mb-2">Media File</label>
                            <div className="border border-dashed border-gray-300 p-4 md:p-8 bg-gray-50 overflow-hidden">
                              <input type="file" accept="image/*,video/*" onChange={e => setPgMedia(e.target.files[0])} className="w-full text-[10px] md:text-xs font-mono text-gray-500 file:mr-2 md:file:mr-4 file:py-1 md:file:py-2 file:px-2 md:file:px-4 file:border file:border-gray-300 file:bg-white file:text-black file:uppercase cursor-pointer" />
                            </div>
                          </div>
                          <div className="flex gap-4 mt-4">
                            <button type="button" onClick={() => setAdminView('list')} className="w-1/3 border border-gray-300 bg-white text-black py-4 font-mono text-sm uppercase tracking-widest font-bold">Cancel</button>
                            <button type="submit" className="w-2/3 bg-black text-white py-4 font-mono text-sm uppercase tracking-widest font-bold">{editingId ? 'Save' : 'Publish'}</button>
                          </div>
                        </form>
                      )}
                    </div>
                  )}
                </div>
              </main>
            </div>
          )}

          {/* DETAIL PAGE MODAL (WORK) */}
          {selectedProject && (
            <div className="fixed inset-0 bg-[#F4F4F0] z-[150] flex flex-col pointer-events-auto overflow-y-auto animate-fade-in">
              <div className="w-full p-6 md:p-10 flex justify-between items-start sticky top-0 bg-[#F4F4F0]/90 backdrop-blur-sm z-10 gap-4">
                <div className="flex-1 max-w-[80%] md:max-w-none">
                  <h2 className="font-anton text-4xl md:text-6xl uppercase tracking-wide break-words">{selectedProject.title}</h2>
                  <div className="flex flex-wrap gap-4 md:gap-6 mt-4 font-mono text-xs text-gray-500 uppercase tracking-widest">
                    <p>Categories <br/><span className="text-black font-bold text-[10px] md:text-sm">{selectedProject.categories.join(', ')}</span></p>
                    <p>Project Type <br/><span className="text-black font-bold text-[10px] md:text-sm">{selectedProject.projectType || 'Individual'}</span></p>
                    <p>Year <br/><span className="text-black font-bold text-[10px] md:text-sm">{selectedProject.year}</span></p>
                    <p>Tools <br/><span className="text-black font-bold text-[10px] md:text-sm">{(selectedProject.tools || []).join(', ') || 'N/A'}</span></p>
                  </div>
                </div>
                
                <button onClick={() => setSelectedProject(null)} className="w-10 h-10 md:w-12 md:h-12 border-2 border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all duration-300 shrink-0 group" aria-label="Close">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="transition-transform duration-300 group-hover:rotate-90">
                    <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                </button>
              </div>

              <div className="w-full max-w-5xl mx-auto px-6 md:px-10 pb-32 mt-4 space-y-12 md:space-y-20">
                <div className="w-full overflow-hidden shadow-2xl bg-black">
                  {selectedProject.mediaType === 'video' ? (
                    <CustomVideoPlayer src={selectedProject.mediaUrl} className="max-h-[50vh] md:max-h-[70vh]" />
                  ) : (
                    <img src={selectedProject.mediaUrl} className="w-full max-h-[50vh] md:max-h-[70vh] object-contain bg-gray-100" />
                  )}
                </div>
                
                {selectedProject.description && (
                  <div className="font-mono text-sm md:text-lg text-gray-800 leading-relaxed max-w-3xl border-l-4 border-black pl-4 md:pl-6">
                    {selectedProject.description.split('\n').map((line, idx) => <p key={idx} className="mb-2">{line}</p>)}
                  </div>
                )}

                {selectedProject.detailBlocks && selectedProject.detailBlocks.map(block => (
                  <div key={block.id} className="w-full flex justify-center">
                    {block.type === 'text' ? (
                      <div className={`text-sm text-gray-800 leading-relaxed max-w-3xl w-full px-6
                        ${block.align === 'center' ? 'text-center' : block.align === 'right' ? 'text-right' : 'text-left'}
                        ${block.font === 'anton' ? 'font-anton text-2xl md:text-4xl uppercase' : block.font === 'mono' ? 'font-mono text-[10px] md:text-sm' : 'font-sans text-sm md:text-base'}
                      `}>
                        {block.content.split('\n').map((line, idx) => <p key={idx} className="mb-4">{line}</p>)}
                      </div>
                    ) : block.type === 'media' && block.content ? (
                      <div className="w-full bg-black shadow-lg">
                        {block.mediaType === 'video' ? ( <CustomVideoPlayer src={block.content} /> ) : ( <img src={block.content} className="w-full object-cover" /> )}
                      </div>
                    ) : null}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* PLAYGROUND LIGHTBOX MODAL */}
          {selectedPlaygroundItem && (
            <div 
              className="fixed inset-0 z-[300] flex items-center justify-center p-4 md:p-12 bg-white/60 backdrop-blur-md animate-fade-in pointer-events-auto"
              onClick={() => setSelectedPlaygroundItem(null)}
            >
              <button 
                onClick={() => setSelectedPlaygroundItem(null)} 
                className="absolute top-4 right-4 md:top-6 md:right-6 w-10 h-10 md:w-12 md:h-12 border-2 border-black rounded-full flex items-center justify-center hover:bg-black hover:text-white transition-all duration-300 shrink-0 group z-50 bg-transparent" 
                aria-label="Close"
              >
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="transition-transform duration-300 group-hover:rotate-90">
                  <line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
              
              <div 
                className="relative max-w-7xl max-h-[90vh] w-full h-full flex items-center justify-center"
                onClick={(e) => e.stopPropagation()}
              >
                {selectedPlaygroundItem.mediaType === 'video' ? (
                  <CustomVideoPlayer src={selectedPlaygroundItem.mediaUrl} className="max-w-full max-h-[85vh] shadow-2xl rounded-sm" />
                ) : (
                  <img src={selectedPlaygroundItem.mediaUrl} alt="Playground Art" className="max-w-full max-h-[85vh] object-contain shadow-2xl rounded-sm" />
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
